  { name: "Myu", gender: "FEMALE", prompt: "Face-focus portrait of a mysterious ethereal young girl with unusual colored hair that seems to drift on its own, large expressive eyes showing both innocence and ancient hidden depth, soft otherworldly features with a gentle knowing gaze, a face that observes far more than it reveals. Close-up face shot, anime style, PFP profile picture, detailed facial features, clean solid background." },
  { name: "Jun", gender: "MALE", prompt: "Face-focus portrait of a young man with a friendly approachable expression, neat well-kept hair, warm curious eyes that miss little, ordinary clean-cut features with a hint of underlying strength that emerges when needed, the unassuming face of someone connected to extraordinary events. Close-up face shot, anime style, PFP profile picture, detailed facial features, clean solid background." }
];

const grid = document.getElementById('cardGrid');
const searchInput = document.getElementById('searchInput');
const countInfo = document.getElementById('countInfo');
const toast = document.getElementById('toast');
let activeFilter = 'ALL';

function renderCards() {
  grid.innerHTML = '';
  characters.forEach((char, index) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.name = char.name.toLowerCase();
    card.dataset.gender = char.gender;
    card.innerHTML = `
      <div class="card-header">
        <div class="card-header-left">
          <h2>${char.name}</h2>
          <span class="gender-tag ${char.gender}">${char.gender}</span>
        </div>
        <button class="copy-btn" data-index="${index}">Copy</button>
      </div>
      <div class="card-body">
        <div class="prompt-text" data-index="${index}">${char.prompt}</div>
      </div>
    `;
    grid.appendChild(card);
  });

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => copyPrompt(btn.dataset.index, btn));
  });
  document.querySelectorAll('.prompt-text').forEach(el => {
    el.addEventListener('click', () => copyPrompt(el.dataset.index));
  });
}

function applyFilters() {
  const query = searchInput.value.toLowerCase().trim();
  const cards = document.querySelectorAll('.card');
  let count = 0;
  cards.forEach(card => {
    const name = card.dataset.name;
    const gender = card.dataset.gender;
    const prompt = card.querySelector('.prompt-text').textContent.toLowerCase();
    const matchSearch = !query || name.includes(query) || prompt.includes(query);
    const matchGender = activeFilter === 'ALL' || gender === activeFilter;
    if (matchSearch && matchGender) {
      card.classList.remove('hidden');
      count++;
    } else {
      card.classList.add('hidden');
    }
  });
  countInfo.textContent = `${count} / ${characters.length} characters`;
}

function copyPrompt(index, btnElement) {
  const text = characters[index].prompt;
  const name = characters[index].name;
  navigator.clipboard.writeText(text).then(() => {
    showToast(`Copied: ${name}`);
    if (btnElement) {
      btnElement.textContent = 'Copied!';
      btnElement.classList.add('copied');
      setTimeout(() => {
        btnElement.textContent = 'Copy';
        btnElement.classList.remove('copied');
      }, 2000);
    }
  });
}

function copyAllVisible() {
  const visibleCards = document.querySelectorAll('.card:not(.hidden)');
  const texts = [];
  visibleCards.forEach(card => {
    const idx = parseInt(card.querySelector('.copy-btn').dataset.index);
    texts.push(`## ${characters[idx].name} [${characters[idx].gender}]\n${characters[idx].prompt}`);
  });
  navigator.clipboard.writeText(texts.join('\n\n')).then(() => {
    showToast(`Copied ${visibleCards.length} prompts!`);
  });
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

searchInput.addEventListener('input', applyFilters);

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.g;
    applyFilters();
  });
});

document.getElementById('copyAllBtn').addEventListener('click', copyAllVisible);

renderCards();
</script>
</body>
</html>
