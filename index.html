<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Illustration Prompts</title>
  <style>
    :root {
      --bg: #0f0f13;
      --card: #1a1a24;
      --border: #2a2a3a;
      --accent: #6c5ce7;
      --accent-hover: #7d6ff0;
      --text: #e0e0e8;
      --text-dim: #8888a0;
      --success: #00d2a0;
      --search-bg: #16161e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 40px 20px 30px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe, #74b9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    .controls {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      background: var(--search-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-dim);
    }

    .copy-all-btn {
      padding: 12px 24px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .copy-all-btn:hover {
      background: var(--accent-hover);
    }

    .count-info {
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .grid {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card.hidden {
      display: none;
    }

    .card-header {
      padding: 16px 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: #a29bfe;
    }

    .copy-btn {
      padding: 6px 14px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: var(--accent);
      color: white;
    }

    .copy-btn.copied {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .card-body {
      padding: 0 16px 16px;
    }

    .prompt-text {
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 14px;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #c0c0d0;
      word-break: break-word;
      white-space: pre-wrap;
      cursor: text;
      user-select: all;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--success);
      color: #0f0f13;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--text-dim);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 768px) {
      header h1 { font-size: 1.6rem; }
      .grid { grid-template-columns: 1fr; }
      .controls { flex-direction: column; }
      .search-box { width: 100%; }
    }
  </style>
</head>

const grid = document.getElementById('cardGrid');
const searchInput = document.getElementById('searchInput');
const countInfo = document.getElementById('countInfo');
const toast = document.getElementById('toast');

function renderCards(data) {
  grid.innerHTML = '';
  data.forEach((char, index) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.name = char.name.toLowerCase();
    card.innerHTML = `
      <div class="card-header">
        <h2>${char.name}</h2>
        <button class="copy-btn" data-index="${index}">Copy</button>
      </div>
      <div class="card-body">
        <div class="prompt-text" data-index="${index}">${char.prompt}</div>
      </div>
    `;
    grid.appendChild(card);
  });

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => copyPrompt(btn.dataset.index, btn));
  });

  document.querySelectorAll('.prompt-text').forEach(el => {
    el.addEventListener('click', () => copyPrompt(el.dataset.index));
  });
}

function copyPrompt(index, btnElement) {
  const text = characters[index].prompt;
  const name = characters[index].name;
  navigator.clipboard.writeText(text).then(() => {
    showToast(`Copied: ${name}`);
    if (btnElement) {
      btnElement.textContent = 'Copied!';
      btnElement.classList.add('copied');
      setTimeout(() => {
        btnElement.textContent = 'Copy';
        btnElement.classList.remove('copied');
      }, 2000);
    }
  });
}

  visibleCards.forEach(card => {
    const idx = parseInt(card.querySelector('.copy-btn').dataset.index);
    texts.push(`## ${characters[idx].name}\n${characters[idx].prompt}`);
  });
  navigator.clipboard.writeText(texts.join('\n\n')).then(() => {
    showToast(`Copied ${visibleCards.length} prompts!`);
  });
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

searchInput.addEventListener('input', () => {
  const query = searchInput.value.toLowerCase().trim();
  const cards = document.querySelectorAll('.card');
  let count = 0;
  cards.forEach(card => {
    const name = card.dataset.name;
    const prompt = card.querySelector('.prompt-text').textContent.toLowerCase();
    if (!query || name.includes(query) || prompt.includes(query)) {
      card.classList.remove('hidden');
      count++;
    } else {
      card.classList.add('hidden');
    }
  });
  countInfo.textContent = `${count} / ${characters.length} characters`;
});

document.getElementById('copyAllBtn').addEventListener('click', copyAllVisible);

renderCards(characters);
</script>
</body>
</html>
